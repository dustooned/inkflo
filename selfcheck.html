<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>inkflo self-check</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <style>
      main { max-width: 64rem; margin: 2rem auto; padding: 0 16px; }
      #summary { font-weight: 600; font-size: 18px; }
      #summary.pass { color: var(--spot-green); }
      #summary.fail { color: var(--spot-red); }
      ol { padding-left: 1.4rem; }
      li { margin: 0.3rem 0; font-variant-numeric: tabular-nums; }
      li.pass::marker { color: var(--spot-green); }
      li.fail { color: var(--spot-red); }
      .note { color: var(--ink-soft); }
      #pages { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 1rem; }
      figure { margin: 0; }
      figure canvas { width: 240px; height: auto; background: var(--paper-lift); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
      figcaption { font-size: 12px; color: var(--ink-soft); }
    </style>
  </head>
  <body>
    <main>
      <h1>Engine self-check</h1>
      <p class="note">Runs the canvas, IndexedDB and replay code in this browser. Uses its own database (<code>inkflo-selfcheck</code>), which it deletes when done; your library is not touched.</p>
      <p id="summary">Running…</p>
      <ol id="results"></ol>
      <div id="pages"></div>
    </main>
    <script type="module" src="/src/selfcheck.ts"></script>
  </body>
</html>
